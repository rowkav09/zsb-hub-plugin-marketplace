name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin catalog, ZIPs and install flow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - name: Verify and scan every installable plugin ZIP without running it
        run: npm run check:packages
      - name: Validate the installable catalog
        run: npm run check
      - name: Exercise marketplace and plugin behavior
        run: npm test
      - name: Verify the pinned publisher catalog and bundles
        run: npm run check:publisher
